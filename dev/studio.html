    <title>diapason CSS integration example</title>

    <style>
      :root {
        color-scheme: light dark;
        --accent: light-dark(#4a557e, #bbc4f3);
        --paper: light-dark(#f1f3fe, #191b26);
      }
      body {
        margin: 0;
        padding: 1rem;
        background: light-dark(#fafafa, #161616);
        color: light-dark(#222, #eee);
        font-family: system-ui;
      }
      main {
        max-width: 60rem;
        margin: auto;
      }
      diapason-studio {
        --diapason-primary: var(--accent);
        --diapason-neutral: var(--paper);
        min-height: 26rem;
      }
    </style>
  </head>
