version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    labels:
      - dependencies
      - dependabot
    groups:
      all-actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    ignore:
      # Remove this hold when @vitejs/plugin-react supports compiler 0.157+.
      - dependency-name: oxc-transform-react
        versions: [">=0.157.0"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    labels:
      - dependencies
      - dependabot
    groups:
      all-dependencies:
        patterns:
          - "*"
