# Folders name the domain, filenames name the thing, dotted lowercase suffixes name the role.
# Dependency rules for each role live in .dependency-cruiser.mjs.

x-src-rules: &src-rules
  .dir: PascalCase
  # Any extension or role suffix not listed below is rejected.
  .*: exists:0
  .*.ts: exists:0
  .*.tsx: exists:0
  .ts: PascalCase | regex:use[A-Z][A-Za-z0-9]*
  .tsx: PascalCase | regex:use[A-Z][A-Za-z0-9]*
  .css: PascalCase
  .model.ts: PascalCase
  .type.ts: PascalCase
  .storage.ts: PascalCase
  .validation.ts: PascalCase
  .codec.ts: PascalCase
  .store.ts: PascalCase
  .worker.ts: PascalCase
  .worklet.ts: PascalCase
  .test.ts: PascalCase | regex:use[A-Z][A-Za-z0-9]*
  .test.tsx: PascalCase | regex:use[A-Z][A-Za-z0-9]*
  .model.test.ts: PascalCase
  .codec.test.ts: PascalCase
  .storage.test.ts: PascalCase
  .validation.test.ts: PascalCase
  .store.test.ts: PascalCase
  .integration.test.ts: PascalCase
  .integration.test.tsx: PascalCase

x-lowercase-rules: &lowercase-rules
  .dir: kebab-case
  .*: exists:0
  .*.ts: exists:0
  .ts: kebab-case
  .test.ts: kebab-case

ls:
  src:
    .dir: regex:src
    .*: exists:0
    .tsx: regex:main
    .d.ts: regex:vite-env
  src/*:
    <<: *src-rules
    .dir: regex:App|Features|Studio|UI|Theme|Audio|Analysis|Diagnostics|Editing|Encoding|Inspection|Melody|Midi|Playback|Recording|Routing|Storage|Tune
  src/*/*: *src-rules
  src/*/*/**: *src-rules

  tests:
    <<: *lowercase-rules
    .tsx: kebab-case
    .test.tsx: kebab-case
  tests/fixtures/**:
    .dir: kebab-case
    .json: kebab-case
    .wav: kebab-case
    .mid: kebab-case

  tools/**: *lowercase-rules
